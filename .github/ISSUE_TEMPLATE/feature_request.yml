name: Feature request
description: Suggest a new capability or an improvement to an existing one.
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Please describe the problem you
        are trying to solve before proposing a specific API — that context makes
        it much easier to land a design that fits the rest of the SDK.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: >
        What are you trying to do, and what makes it hard or impossible today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: >
        What would you like `rai-sdk` to do? A sketch of the API you would want
        to write is very welcome.
      render: rust
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the SDK does this touch?
      multiple: true
      options:
        - Client and request builder
        - Models
        - Structured output
        - Tool calling
        - Streaming
        - Multimodal content
        - Retries and errors
        - Configuration
        - OpenAI provider
        - Anthropic provider
        - OpenRouter provider
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: >
        Other approaches you thought about, including anything you can already
        do today as a workaround.
    validations:
      required: false

  - type: checkboxes
    id: breaking
    attributes:
      label: Compatibility
      options:
        - label: This would be a breaking change to the public API.
          required: false

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a pull request for this.
          required: false
