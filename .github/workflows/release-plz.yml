name: Release-plz

# release-plz runs directly on every push to main: it bumps Cargo.toml and
# CHANGELOG.md from conventional commits since the last release tag, commits
# that directly to main as a bot commit, and pushes the resulting `vX.Y.Z`
# tag. There is no Release PR — merging to main *is* the release decision.
#
# release-plz never runs `cargo publish` and never creates the GitHub Release
# itself (see release-plz.toml: `publish = false`, `git_release_enable =
# false`). The tag this workflow pushes triggers the existing
# .github/workflows/release.yml, which remains the single place a crates.io
# publish or a GitHub Release happens.
#
# Accepted trade-off (see CONTRIBUTING.md's "Releases" section): every
# feat/fix/perf/refactor/revert (or breaking) merge to main publishes to
# crates.io immediately, with no batching window and no review step in
# between. crates.io has no unpublish, only yank, so a bad release is fixed
# forward or yanked, never erased.
#
# Self-trigger guard. This pattern's classic failure mode is the bot's own
# commit re-triggering this same workflow forever, so this has three
# independent layers:
#   1. Actor guard (below): skip if the triggering push's actor is the
#      github-actions bot itself.
#   2. Message guard (below): skip if the triggering push's head commit
#      message starts with `chore(release):` — this workflow's own commit
#      message shape, chosen to also be skipped by release-plz.toml's
#      changelog commit_parsers (`^chore` is skipped there).
#   3. Structural guard (in the "releasable commits" step): even if 1 and 2
#      somehow both failed to match, that step would still find zero
#      releasable commits, because the tag this workflow pushes points at
#      the exact commit that would be re-triggering the run. A wasted rerun
#      is a fast no-op, not a loop, regardless of guards 1/2.
# Deliberately not used: path-based filtering (e.g. a trigger-level
# `paths-ignore` on Cargo.toml/Cargo.lock/CHANGELOG.md). A legitimate
# dependency bump (`chore(deps)`, merged via Dependabot) also touches only
# Cargo.toml/Cargo.lock, and must still reach the "releasable commits" gate
# below rather than being silently discarded by path alone.
#
# THE TOKEN TRAP. GitHub Actions deliberately does not let a push or tag made
# with the automatic `GITHUB_TOKEN` trigger *other* workflow runs (its
# anti-recursion guard). release.yml is a separate workflow, triggered by the
# `vX.Y.Z` tag this job pushes — so if this job pushed that tag using
# `GITHUB_TOKEN`, release.yml would simply never start, and nothing would
# ever reach crates.io or get a GitHub Release, with no error anywhere to
# point at why. A personal access token does not carry that restriction, so
# this workflow requires a `RELEASE_PLZ_TOKEN` PAT secret and hard-fails (see
# the "Require a release PAT" step below) instead of silently falling back to
# `GITHUB_TOKEN` when it's absent — a silent fallback was considered and
# rejected because it would make the chain look fully configured while
# quietly never publishing anything.
#
# Maintainer checklist for this to work:
#  1. Create a fine-grained PAT and add it as the `RELEASE_PLZ_TOKEN`
#     repository secret (Settings -> Secrets and variables -> Actions -> New
#     repository secret):
#       - github.com/settings/personal-access-tokens/new
#       - Resource owner: the account that should own the token (typically
#         the repo owner, since this is a personal, non-org repo).
#       - Repository access: "Only select repositories" -> this repository.
#       - Permissions -> Repository permissions -> Contents: "Read and
#         write". No other permission is required.
#       - Set an expiration and put a reminder on the calendar to rotate it
#         before then; fine-grained PATs cannot be made non-expiring.
#     Name the secret exactly `RELEASE_PLZ_TOKEN`.
#  2. This repository's ruleset on `main` (see below and the PR that
#     introduced this workflow for the exact `gh api` command) must exempt
#     the push this token makes from the required-status-checks rule, or a
#     brand new commit that was never itself pushed to a checked ref would
#     fail that same requirement it's meant to enforce on everyone else.
#     Concretely: a push authenticated with a PAT is attributed to the PAT's
#     *owning user account*, not to the `github-actions` app (that
#     attribution only happens for the default `GITHUB_TOKEN`, and GitHub's
#     Rulesets API rejects `Integration`-type bypass entries for the
#     built-in `github-actions` app on a personal, non-org-owned repository
#     like this one — "Actor GitHub Actions integration must be part of the
#     ruleset source or owner organization"). Since `RELEASE_PLZ_TOKEN` is a
#     PAT owned by this repository's admin (step 1 above), the bypass entry
#     that actually works here is `actor_type: RepositoryRole`, `actor_id: 5`
#     (Repository admin), `bypass_mode: always`.
#
# CARGO_REGISTRY_TOKEN is not needed here: `publish = false` in
# release-plz.toml means this workflow never calls `cargo publish`. That
# secret is only consumed by release.yml.
on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release-plz
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: >-
      github.actor != 'github-actions[bot]' &&
      !startsWith(github.event.head_commit.message, 'chore(release):')
    steps:
      - name: Checkout repository
        # This checkout only needs to read history to decide whether there's
        # anything releasable (the "Check for releasable commits" step
        # below), so GITHUB_TOKEN is fine here even when RELEASE_PLZ_TOKEN is
        # absent — the "Require a release PAT" step, gated on that decision,
        # is what actually enforces the PAT requirement before anything is
        # pushed.
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install release-plz
        uses: taiki-e/install-action@v2
        with:
          tool: release-plz

      - name: Check for releasable commits since the last tag
        id: gate
        run: |
          last_tag="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"
          if [ -n "$last_tag" ]; then
            range="${last_tag}..HEAD"
          else
            range="HEAD"
          fi
          echo "Commits in range ${range}:"
          git log --format='%s' "$range" | tee /tmp/commits-since-last-tag.txt

          # A commit is releasable if its conventional-commit type changes
          # published behavior (feat/fix/perf/refactor/revert), or it's
          # marked breaking (`!` after the type, or a `BREAKING CHANGE:`
          # trailer). docs/style/test/build/ci/chore-only history must not
          # trigger a release, matching release-plz.toml's commit_parsers.
          if grep -Eiq '^(feat|fix|perf|refactor|revert)(\([a-z0-9./-]+\))?!?:|BREAKING CHANGE' /tmp/commits-since-last-tag.txt; then
            echo "releasable=true" >> "$GITHUB_OUTPUT"
          else
            echo "No releasable commits since ${last_tag:-the beginning of history}; nothing to do."
            echo "releasable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require a release PAT
        # See "THE TOKEN TRAP" above: GITHUB_TOKEN-pushed tags never trigger
        # release.yml, so a missing RELEASE_PLZ_TOKEN must fail this run
        # loudly here, before anything is bumped, committed, or pushed —
        # never fall back to GITHUB_TOKEN for the steps that actually push.
        # The `secrets` context isn't readable from a step's `if:` (only
        # from `env:`/`with:`/`run:`), so the secret is mirrored into `env`
        # first and the `if:` reads it back from there.
        if: steps.gate.outputs.releasable == 'true' && env.RELEASE_PLZ_TOKEN == ''
        env:
          RELEASE_PLZ_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: |
          echo "::error::RELEASE_PLZ_TOKEN repository secret is not set. Tags pushed with the default GITHUB_TOKEN do not trigger other workflows, so release.yml would never fire on the tag this job would push and nothing would ever publish. See the maintainer checklist at the top of this file to create the required fine-grained PAT."
          exit 1

      - name: Configure git identity for the release bot
        if: steps.gate.outputs.releasable == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version and changelog
        if: steps.gate.outputs.releasable == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: release-plz update --repo-url "https://github.com/${GITHUB_REPOSITORY}"

      - name: Commit the release
        if: steps.gate.outputs.releasable == 'true'
        id: commit
        run: |
          if git diff --quiet -- Cargo.toml Cargo.lock CHANGELOG.md; then
            echo "release-plz update produced no changes; nothing to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="$(sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' Cargo.toml | head -n 1)"
          if [ -z "$version" ]; then
            echo "::error file=Cargo.toml::could not read version from Cargo.toml"
            exit 1
          fi
          git add Cargo.toml Cargo.lock CHANGELOG.md
          git commit -m "chore(release): v${version}"
          git push origin HEAD:refs/heads/main
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Tag and push
        if: steps.gate.outputs.releasable == 'true' && steps.commit.outputs.committed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: release-plz release --repo-url "https://github.com/${GITHUB_REPOSITORY}"
