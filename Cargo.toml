[package]
name = "rai-sdk"
version = "0.1.2"
edition = "2024"
rust-version = "1.86"
authors = ["Ronnie Andrew Magatti <ronniemagatti@gmail.com>"]
description = "Rust AI SDK — unified client for OpenAI, Anthropic, and OpenRouter with typed models, structured output, tool calling, and streaming"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/rmagatti/rai-sdk"
homepage = "https://rmagatti.github.io/rai-sdk/"
documentation = "https://docs.rs/rai-sdk"
keywords = ["ai", "llm", "openai", "anthropic", "openrouter"]
categories = ["api-bindings", "asynchronous"]
exclude = [
    "/.github/",
    "/target/",
    "/.gitignore",
]
# Note: `docs/` (the mdBook guide source) is intentionally packaged. Guide
# chapters are included as doctests under `cfg(doctest)`, so shipping them keeps
# `cargo test --doc` working for consumers of the published crate.

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
# Async runtime & streams
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
async-stream = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP
#
# `default-features = false` hands the TLS choice to this crate's `rustls-tls`
# and `native-tls` features. reqwest's remaining defaults (`charset`, `http2`,
# `system-proxy`) are re-listed explicitly, since dropping them would silently
# lose HTTP/2 and system proxy support.
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "stream",
    "charset",
    "http2",
    "system-proxy",
] }
bytes = "1"

# Error handling
thiserror = "2"

# Logging
tracing = "0.1"

# Schema generation & validation
schemars = "1.2"
# `default-features = false` drops `resolve-http` and `tls-aws-lc-rs`, which
# would otherwise pull a second reqwest/rustls stack in with a hard-coded crypto
# provider — defeating this crate's TLS feature choice and forcing a cmake/C
# build even when `native-tls` is selected. It also means a schema `$ref` can no
# longer trigger an outbound HTTP request. Schemas here are generated locally
# from Rust types, so remote resolution is not needed. Internal `$ref`/`$defs`
# resolution is unaffected.
jsonschema = { version = "0.49", default-features = false }

# Retry jitter
rand = "0.10"

[dev-dependencies]
tokio-test = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Offline provider mocking and env-var isolation for tests
wiremock = "0.6"
serial_test = "4"
# The HTTP server in `examples/sse_proxy.rs`, which demonstrates re-emitting
# rai-sdk stream events over SSE. Not used by the crate itself.
axum = "0.8"

# The SSE proxy example drives a real provider through an axum handler, so it
# needs a provider compiled in. Naming it here keeps a providerless
# `--no-default-features` build from trying to compile it.
[[example]]
name = "sse_proxy"
required-features = ["openai"]

# Talks to an OpenAI-compatible endpoint, which the `openai` feature gates.
[[example]]
name = "local_model"
required-features = ["openai"]

[features]
default = ["openai", "anthropic", "openrouter", "rustls-tls"]

# Providers.
#
# `openai` also gates the OpenAI-compatible provider (Ollama, vLLM, LM Studio,
# and anything else serving `POST {base_url}/chat/completions`). That is not a
# separate feature because it is not a separate wire format: it reuses the
# `openai` module's request builder and SSE parser, so a dedicated feature could
# only ever imply `openai` — a knob with one position — while splitting the
# provider matrix CI already covers.
openai = []
anthropic = []
openrouter = []

# TLS backend. A provider requires at least one; a featureless, providerless
# build needs neither. If feature unification enables both, rai-sdk uses rustls.
#
# `rustls-tls` is the default and needs no system OpenSSL, but builds
# `aws-lc-rs`, which requires cmake and a C compiler. `native-tls` uses the
# platform TLS stack instead (Secure Transport on macOS, SChannel on Windows,
# OpenSSL on Linux), which avoids that build requirement.
rustls-tls = ["reqwest/rustls"]
native-tls = ["reqwest/native-tls"]

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "warn"
